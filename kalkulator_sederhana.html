<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: linear-gradient(135deg, #e8efff, #f5f7fb);
      font-family: Arial, Helvetica, sans-serif; color: #172033;
    }
    .calculator {
      width: min(100%, 360px); padding: 22px; border-radius: 24px;
      background: #fff; box-shadow: 0 18px 50px rgba(31, 50, 90, .14);
    }
    h1 { margin: 0 0 18px; font-size: 20px; text-align: center; }
    .screen {
      min-height: 112px; padding: 18px; margin-bottom: 16px; border-radius: 16px;
      background: #f1f4fa; display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end; overflow: hidden;
    }
    #history { min-height: 20px; color: #7b8497; font-size: 14px; }
    #display {
      width: 100%; text-align: right; font-size: clamp(28px, 9vw, 38px);
      font-weight: 700; white-space: nowrap; overflow-x: auto;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      border: 0; border-radius: 14px; min-height: 62px; cursor: pointer;
      background: #f1f4fa; color: #26334d; font-size: 21px; font-weight: 600;
      transition: transform .08s, filter .15s;
    }
    button:active { transform: scale(.96); }
    button:hover { filter: brightness(.97); }
    .utility { background: #e3eaff; color: #3159b7; }
    .operator { background: #eaf0ff; color: #3159b7; }
    .equals { background: #3159d8; color: #fff; }
    .zero { grid-column: span 2; }
    .hint { margin: 15px 0 0; text-align: center; color: #8992a3; font-size: 12px; }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>Kalkulator</h1>
    <section class="screen" aria-live="polite">
      <div id="history"></div>
      <div id="display">0</div>
    </section>
    <section class="keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="backspace">⌫</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
    <p class="hint">Bisa digunakan dengan keyboard komputer</p>
  </main>

  <script>
    const display = document.getElementById('display');
    const history = document.getElementById('history');
    let current = '0';
    let stored = null;
    let operator = null;
    let waitingForNumber = false;

    function render() { display.textContent = current; }
    function clearAll() {
      current = '0'; stored = null; operator = null;
      waitingForNumber = false; history.textContent = ''; render();
    }
    function inputNumber(value) {
      if (current === 'Error' || waitingForNumber) {
        current = value === '.' ? '0.' : value;
        waitingForNumber = false;
      } else if (value === '.') {
        if (!current.includes('.')) current += '.';
      } else {
        current = current === '0' ? value : current + value;
      }
      render();
    }
    function calculate(a, b, op) {
      if (op === '+') return a + b;
      if (op === '-') return a - b;
      if (op === '*') return a * b;
      if (op === '/') return b === 0 ? null : a / b;
      return b;
    }
    function format(value) {
      if (!Number.isFinite(value)) return 'Error';
      return String(Number(value.toPrecision(12)));
    }
    function chooseOperator(nextOperator) {
      if (current === 'Error') return;
      const input = Number(current);
      if (operator && !waitingForNumber) {
        const result = calculate(stored, input, operator);
        if (result === null) { current = 'Error'; stored = null; operator = null; render(); return; }
        current = format(result);
        stored = result;
      } else {
        stored = input;
      }
      operator = nextOperator;
      waitingForNumber = true;
      history.textContent = `${current} ${symbol(nextOperator)}`;
      render();
    }
    function symbol(op) { return ({'/':'÷','*':'×','-':'−','+':'+'})[op] || op; }
    function equals() {
      if (!operator || stored === null || current === 'Error') return;
      const left = stored, right = Number(current), op = operator;
      const result = calculate(left, right, op);
      history.textContent = `${format(left)} ${symbol(op)} ${format(right)} =`;
      current = result === null ? 'Error' : format(result);
      stored = null; operator = null; waitingForNumber = true; render();
    }
    function backspace() {
      if (current === 'Error' || waitingForNumber) { current = '0'; waitingForNumber = false; }
      else current = current.length > 1 ? current.slice(0, -1) : '0';
      render();
    }
    function percent() {
      if (current === 'Error') return;
      current = format(Number(current) / 100); render();
    }
    function handleButton(button) {
      const value = button.dataset.value;
      const action = button.dataset.action;
      if (value !== undefined) {
        if ('0123456789.'.includes(value) && value.length === 1) inputNumber(value);
        else chooseOperator(value);
      } else if (action === 'clear') clearAll();
      else if (action === 'backspace') backspace();
      else if (action === 'percent') percent();
      else if (action === 'equals') equals();
    }
    document.querySelector('.keys').addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) handleButton(button);
    });
    document.addEventListener('keydown', event => {
      const key = event.key;
      if (/^[0-9.]$/.test(key)) inputNumber(key);
      else if (['+', '-', '*', '/'].includes(key)) chooseOperator(key);
      else if (key === 'Enter' || key === '=') { event.preventDefault(); equals(); }
      else if (key === 'Backspace') backspace();
      else if (key === 'Escape') clearAll();
      else if (key === '%') percent();
    });
  </script>
</body>
</html>
